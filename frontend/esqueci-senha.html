<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esqueci minha senha | Meu Futuro</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >
</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-card login-card">

            <!-- =========================================
                 LOGO
            ========================================== -->

            <div class="logo">

                <div class="logo-icon">
                    MF
                </div>

                <div>
                    <strong>
                        MEU FUTURO
                    </strong>

                    <span>
                        Projeto de Vida
                    </span>
                </div>

            </div>


            <!-- =========================================
                 TÍTULO
            ========================================== -->

            <span class="step-label">
                RECUPERAÇÃO DE ACESSO
            </span>

            <h1>
                Esqueceu sua senha? 🔑
            </h1>

            <p class="subtitle">
                Informe o e-mail cadastrado na sua conta
                para continuar e criar uma nova senha.
            </p>


            <!-- =========================================
                 E-MAIL
            ========================================== -->

            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@email.com"
                    autocomplete="email"
                >

            </div>


            <!-- =========================================
                 MENSAGEM
            ========================================== -->

            <div
                id="mensagem"
                class="mensagem"
                style="display: none;"
            ></div>


            <!-- =========================================
                 BOTÃO
            ========================================== -->

            <button
                type="button"
                id="btnRecuperar"
                class="btn-finish"
                style="width: 100%;"
                onclick="recuperarSenha()"
            >
                Continuar
            </button>


            <!-- =========================================
                 VOLTAR PARA LOGIN
            ========================================== -->

            <p class="login-link">

                Lembrou sua senha?

                <a href="login.html">
                    Voltar para o login
                </a>

            </p>


            <!-- =========================================
                 CRIAR CONTA
            ========================================== -->

            <p class="login-link">

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Criar cadastro
                </a>

            </p>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        async function recuperarSenha() {

            const emailInput =
                document.getElementById("email");

            const mensagem =
                document.getElementById("mensagem");

            const botao =
                document.getElementById("btnRecuperar");

            const email =
                emailInput.value.trim().toLowerCase();


            // -----------------------------------------
            // LIMPAR MENSAGEM
            // -----------------------------------------

            mensagem.style.display = "none";
            mensagem.textContent = "";


            // -----------------------------------------
            // VALIDAR E-MAIL
            // -----------------------------------------

            if (!email) {

                mostrarMensagem(
                    "Digite seu e-mail para continuar."
                );

                emailInput.focus();

                return;
            }


            if (!email.includes("@")) {

                mostrarMensagem(
                    "Digite um e-mail válido."
                );

                emailInput.focus();

                return;
            }


            // -----------------------------------------
            // DESABILITAR BOTÃO
            // -----------------------------------------

            botao.disabled = true;
            botao.textContent = "Verificando...";


            try {

                const resposta =
                    await fetch(
                        "/api/recuperar-senha",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );


                const dados =
                    await resposta.json();


                // -----------------------------------------
                // ERRO
                // -----------------------------------------

                if (!resposta.ok) {

                    mostrarMensagem(
                        dados.erro ||
                        "Não foi possível realizar a recuperação."
                    );

                    botao.disabled = false;
                    botao.textContent = "Continuar";

                    return;
                }


                // -----------------------------------------
                // SALVAR E-MAIL TEMPORARIAMENTE
                // -----------------------------------------

                sessionStorage.setItem(
                    "emailRecuperacao",
                    email
                );


                // -----------------------------------------
                // IR PARA NOVA SENHA
                // -----------------------------------------

                window.location.href =
                    "nova-senha.html";


            } catch (erro) {

                console.error(
                    "Erro na recuperação:",
                    erro
                );

                mostrarMensagem(
                    "Não foi possível conectar ao servidor. Tente novamente."
                );

                botao.disabled = false;
                botao.textContent = "Continuar";
            }

        }


        // =============================================
        // MOSTRAR MENSAGEM
        // =============================================

        function mostrarMensagem(texto) {

            const mensagem =
                document.getElementById("mensagem");

            mensagem.textContent = texto;
            mensagem.style.display = "block";

        }


        // =============================================
        // PERMITIR ENTER
        // =============================================

        document
            .getElementById("email")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        recuperarSenha();

                    }

                }
            );

    </script>

</body>

</html>
