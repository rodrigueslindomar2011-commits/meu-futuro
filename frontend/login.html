<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Meu Futuro</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-card login-card">

            <!-- LOGO -->
            <div class="logo">

                <div class="logo-icon">
                    MF
                </div>

                <div>
                    <strong>MEU FUTURO</strong>

                    <span>
                        Projeto de Vida
                    </span>
                </div>

            </div>


            <!-- TÍTULO -->
            <span class="step-label">
                BEM-VINDO DE VOLTA
            </span>

            <h1>
                Entre na sua jornada 🚀
            </h1>

            <p class="subtitle">
                Continue acompanhando seu desenvolvimento,
                seus interesses e seus planos para o futuro.
            </p>


            <!-- E-MAIL -->
            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@email.com"
                >

            </div>


            <!-- SENHA -->
            <div class="input-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

            </div>


            <!-- ESQUECI A SENHA -->
            <div class="login-options">

                <a href="esqueci-senha.html">
                    Esqueci minha senha
                </a>

            </div>


            <!-- BOTÃO ENTRAR -->
            <button
                class="btn-finish"
                type="button"
                style="width: 100%;"
                onclick="login()"
            >
                Entrar
            </button>


            <!-- CADASTRO -->
            <p class="login-link">

                Ainda não possui uma conta?

                <a href="cadastro.html">
                    Criar cadastro
                </a>

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT DO LOGIN -->
    <script src="js/login.js"></script>

</body>

</html>
